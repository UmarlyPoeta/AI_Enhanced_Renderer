name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["*"]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ ninja-build \
            xorg-dev libgl1-mesa-dev xvfb \
            libglfw3-dev libopencv-dev libopencv-contrib-dev \
            python3 python3-opencv python3-matplotlib

      - name: Setup extern dependencies
        run: bash tools/setup_extern.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: xvfb-run ctest --test-dir build --output-on-failure

      - name: Benchmark script smoke test
        run: python3 tools/benchmark_sr.py || true
